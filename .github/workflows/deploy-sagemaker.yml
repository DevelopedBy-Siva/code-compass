name: Test and deploy backend to SageMaker

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "scripts/**"
      - ".github/workflows/deploy-sagemaker.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: code-compass-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      SAGEMAKER_ENDPOINT_NAME: ${{ vars.SAGEMAKER_ENDPOINT_NAME }}
      SAGEMAKER_EXECUTION_ROLE_ARN: ${{ vars.SAGEMAKER_EXECUTION_ROLE_ARN }}
      SAGEMAKER_INSTANCE_TYPE: ${{ vars.SAGEMAKER_INSTANCE_TYPE }}
      QDRANT_URL: ${{ vars.QDRANT_URL }}
      QDRANT_API_KEY_SECRET_ARN: ${{ vars.QDRANT_API_KEY_SECRET_ARN }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r server/requirements.txt

      - name: Run backend tests
        working-directory: server
        run: python -m unittest discover -s tests -v

      - name: Configure temporary AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build image
        run: ./scripts/build.sh

      - name: Push image to ECR
        run: ./scripts/push.sh

      - name: Deploy SageMaker endpoint
        run: ./scripts/deploy.sh
